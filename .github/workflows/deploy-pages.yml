name: Deploy to GitHub Pages

# Publishes the static export of the Next.js app (app/out) to GitHub Pages.
#
# The site is fully client-side: it reads curve state over the visitor's RPC
# and sends transactions through their connected wallet, so no server or
# secret is needed. The launchpad board falls back to the coins a visitor has
# launched/visited (read straight from chain) when no indexer API is
# configured; set the NEXT_PUBLIC_API_URL repo variable to point at a hosted
# backend for the global board and live feed.
on:
  push:
    branches: [main, master, claude/solana-launchpad-bonding-curve-lqx3dd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a new push supersede an old run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: pnpm install --frozen-lockfile

      # The app consumes @daofun/sdk; build it so type/dist resolution is ready.
      - run: pnpm --filter @daofun/sdk build

      - name: Build static site
        working-directory: app
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Devnet by default. A repo variable can override any of these.
          NEXT_PUBLIC_CLUSTER: ${{ vars.NEXT_PUBLIC_CLUSTER || 'devnet' }}
          NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL || 'https://api.devnet.solana.com' }}
          NEXT_PUBLIC_LAUNCHPAD_PROGRAM_ID: ${{ vars.NEXT_PUBLIC_LAUNCHPAD_PROGRAM_ID || 'DaV3ystSgyM9ALDCbtv9AzyfEtAuPe9x8jVacYDdSU7V' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: pnpm exec next build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
